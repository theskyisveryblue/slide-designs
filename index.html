<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slide Designs</title>
    <script>
      try {
        var savedAppearance = localStorage.getItem('slide-designs:appearance:v1');
        var resolvedAppearance = savedAppearance === 'dark' || (savedAppearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.dataset.appearance = resolvedAppearance;
        document.documentElement.style.colorScheme = resolvedAppearance;
      } catch (_) { document.documentElement.dataset.appearance = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <meta name="description" content="A local-first slide editor with editable PowerPoint, offline HTML and image export." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232F6B52'/%3E%3Crect x='7' y='9' width='18' height='11' rx='2' fill='%23F4F1EA'/%3E%3Crect x='7' y='23' width='11' height='2.5' rx='1.25' fill='%23F4F1EA'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
